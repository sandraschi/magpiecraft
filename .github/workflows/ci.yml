name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: windows (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: App smoke (headless)
        run: |
          $env:MAGPIECRAFT_HOME = "${{ runner.temp }}\magpiecraft-ci"
          cargo run -q -p magpiecraft-app -- --smoke
        shell: pwsh

      - name: MCP stdio probe
        shell: pwsh
        run: |
          $env:MAGPIECRAFT_HOME = "${{ runner.temp }}\magpiecraft-ci"
          $exe = "target\debug\magpiecraft-mcp.exe"
          $lines = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"media_catalog","arguments":{"operation":"status"}}}'
          )
          $out = $lines | & $exe mcp
          if ($out.Count -ne 3) { throw "expected 3 JSON-RPC replies, got $($out.Count)" }
          if ($out -notmatch '"tools"') { throw "tools/list returned no tools" }
